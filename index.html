<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>777 Play — Jogos</title>
<style>
:root{--bg:#050a08;--panel:#101a13;--green:#36e64f;--lime:#b3ff48;--muted:#91a096;--line:#23352a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#142719 0,#050a08 55%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.shell{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px;background:linear-gradient(180deg,#07100b 0%,#030605 100%);box-shadow:0 0 40px #0008}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #26422a;background:#07100beF;position:sticky;top:0;z-index:5}
.menu{font-size:26px;cursor:pointer}.logo{font-size:clamp(26px,6vw,42px);font-weight:1000;font-style:italic;letter-spacing:-2px;color:#9cff45;text-shadow:0 2px 0 #246323,0 0 14px #48ff4970}.wallet{font-size:12px;color:#c6d5c8;background:#14231a;border:1px solid #305438;border-radius:18px;padding:8px 10px}
.categories{display:flex;gap:12px;padding:16px 14px;overflow:auto;scrollbar-width:none}.cat{min-width:105px;border:1px solid #355c39;border-radius:16px;background:linear-gradient(#192b20,#09110c);padding:10px 8px;text-align:center;box-shadow:0 5px 0 #16311d;cursor:pointer}.cat .ico{width:58px;height:55px;margin:0 auto 6px;border:3px solid #42d84b;border-radius:14px 14px 22px 22px;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle,#33583b,#0a140d);transform:skewY(-2deg)}.cat span{font-weight:800;font-size:13px}.cat.active{border-color:#b0ff54;box-shadow:0 0 15px #6dff5460,0 4px 0 #17331c}
.section{margin:4px 14px 12px;border-top:3px solid #5ce74b;border-bottom:2px solid #28422d;display:flex;align-items:center;justify-content:space-between;padding:10px 4px;font-size:19px;font-weight:900}.section .hot{display:flex;gap:9px;align-items:center}.section button{background:#17251a;color:white;border:1px solid #568e48;border-radius:22px;padding:8px 13px;font-weight:800}
.grid{padding:0 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.game{aspect-ratio:2/2.8;border-radius:17px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 5px 12px #0008;border:1px solid #243b2c;transition:transform .15s}.game:hover{transform:translateY(-3px)}.game:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,#00000025 55%,#000a 100%)}.game .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:clamp(18px,4vw,30px);font-weight:1000;text-shadow:0 3px 4px #000;letter-spacing:-1px}.game .name{position:absolute;bottom:8px;left:6px;right:6px;text-align:center;font-weight:900;font-size:clamp(10px,2.5vw,15px);line-height:1.1;text-shadow:0 2px 3px #000}.game .star{position:absolute;top:7px;right:7px;background:#ffffffbb;color:#342b17;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:12px}
.g1{background:linear-gradient(135deg,#a31d08,#ffb326,#e6381c)}.g2{background:linear-gradient(135deg,#2b4cdb,#e75ac2,#a6f3ff)}.g3{background:linear-gradient(135deg,#4c13a2,#ef38d0,#3bc7ff)}.g4{background:linear-gradient(135deg,#76220d,#efb85b,#9c3b1a)}.g5{background:linear-gradient(135deg,#d17c06,#ffef70,#f04a16)}.g6{background:linear-gradient(135deg,#182f70,#57bdc9,#2358a8)}.g7{background:linear-gradient(135deg,#11752c,#65ef54,#e2c72b)}.g8{background:linear-gradient(135deg,#e849b0,#f8b58a,#8d2fcd)}.g9{background:linear-gradient(135deg,#d48a19,#fbe54d,#bd3410)}.g10{background:linear-gradient(135deg,#3e148a,#e94bda,#2779ed)}.g11{background:linear-gradient(135deg,#f6a928,#e95d15,#ffdc6d)}.g12{background:linear-gradient(135deg,#0870ad,#43c3ed,#173c95)}.g13{background:linear-gradient(135deg,#46299e,#8e63fc,#df4dc9)}.g14{background:linear-gradient(135deg,#4c248d,#ec69bc,#e68d42)}.g15{background:linear-gradient(135deg,#fa7d11,#ffec68,#e938ad)}.g16{background:linear-gradient(135deg,#0e8b4a,#75ec87,#206dce)}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;z-index:6;background:#060b08f2;border-top:2px solid #376b3b;display:flex;justify-content:space-around;padding:10px 5px 8px}.nav{border:0;background:none;color:#718076;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:54px}.nav .icon{font-size:23px}.nav.active{color:#52f65e}.nav.center .icon{background:radial-gradient(circle,#98ff3d,#26a92e);color:#07110a;padding:10px;border-radius:50%;font-size:26px;box-shadow:0 0 13px #66ff4160}.notice{display:none;margin:14px;padding:14px;border:1px solid #385c3b;border-radius:12px;background:#101c13;color:#d4e6d6}.notice.show{display:block}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#101b13;border:1px solid #55b84d;border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center}.box button{background:#39d947;color:#061009;border:0;border-radius:12px;padding:10px 18px;font-weight:900;margin-top:12px}
@media(max-width:480px){.grid{gap:10px}.cat{min-width:90px}.categories{gap:9px;padding:13px 10px}.section{margin-left:10px;margin-right:10px}.grid{padding:0 10px}}
</style></head>
<body><div class="shell">
<header><div class="menu" onclick="toast('Menu demonstrativo')">☰</div><div class="logo">777 PLAY ✨</div><div class="wallet">🪙 0,00</div></header>
<div class="categories" id="cats"><div class="cat active" data-cat="Quente"><div class="ico">🔥</div><span>Quente</span></div><div class="cat" data-cat="PG"><div class="ico">🎰</div><span>PG</span></div><div class="cat" data-cat="TaDa"><div class="ico">🪅</div><span>TaDa</span></div><div class="cat" data-cat="FC"><div class="ico">🎮</div><span>FC</span></div><div class="cat" data-cat="Todos"><div class="ico">⭐</div><span>Todos</span></div></div>
<div class="section"><div class="hot">🔥 <span id="heading">Quente jogos</span></div><button onclick="filter('Todos')">Todos　348 ›</button></div>
<div style="padding:0 14px 12px"><input id="search" placeholder="🔎 Buscar jogo..." style="width:100%;padding:12px;border-radius:12px;background:#102016;color:white;border:1px solid #355c39;font-size:15px" /></div>
<div class="grid" id="games"></div><div class="notice" id="notice"></div>
</div>
<nav class="bottom"><button class="nav active" onclick="navTo('Início',this)"><span class="icon">⌂</span>Início</button><button class="nav" onclick="navTo('Promoção',this)"><span class="icon">🎁</span>Promoção</button><button class="nav center" onclick="navTo('Jogos',this)"><span class="icon">🎲</span>Jogos</button><button class="nav" onclick="navTo('Carteira demo',this)"><span class="icon">▣</span>Carteira</button><button class="nav" onclick="navTo('Perfil',this)"><span class="icon">♟</span>Perfil</button></nav>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Jogo</h2><p>Catálogo demonstrativo com 348 cards. Não há apostas nem dinheiro real.</p><button onclick="closeModal()">Fechar</button></div></div>
<script>
const base=[['Fortune Tiger','🐯','g1','PG'],['Fortune Rabbit','🐰','g2','PG'],['Fortune Dragon','🐲','g3','TaDa'],['Fortune Ox','🐂','g4','FC'],['Fortune Mouse','🐭','g5','PG'],['Cash Mania','💰','g6','FC'],['Money Coming','💵','g7','TaDa'],['Pinata Wins','🎉','g8','FC'],['Lucky Fortune','👑','g9','PG'],['Fortune Snake','🐍','g10','TaDa'],['Fortune Gems','💎','g11','FC'],['Ocean Treasure','🌊','g12','TaDa'],['Neko Fortune','🐱','g13','PG'],['Fortune Horse','🐴','g14','PG'],['Candy Bonanza','🍬','g15','TaDa'],['Island Adventure','🌴','g16','FC'],['Wild Bandito','🤠','g1','PG'],['Jungle Delight','🦁','g2','FC'],['Golden Empire','🏛️','g3','TaDa'],['Fire Kirin','🐉','g4','FC'],['Super Ace','🃏','g5','PG'],['Treasures of Aztec','🗿','g6','TaDa'],['Dragon Hatch','🥚','g7','FC'],['Wild Bounty','🏜️','g8','PG'],['Lucky Neko','🐈','g9','PG'],['Starlight Princess','🌟','g10','PG'],['Sweet Bonanza','🍭','g11','PG'],['Mahjong Ways','🀄','g12','PG'],['Ways of the Qilin','🦄','g13','PG'],['The Great Icescape','❄️','g14','PG'],['Rise of Apollo','⚡','g15','PG'],['Ganesha Gold','🐘','g16','PG']];
const extras=['Golden Panda','Wild Treasure','Mystic Forest','Royal Coins','Lucky Clover','Moonlight','Treasure Island','Diamond Rush','Magic Lamp','Dragon Fortune','Fruit Party','Seven Stars','Golden Joker','Wild Queen','Pirate Gold','Crystal Kingdom','Neon Nights','Super Jackpot','Lucky Wheel','Golden Phoenix','Emerald City','Candy Kingdom','Mystic Dragon','Fire Temple','Star Quest','Ocean King','Wild Safari','Mega Fortune','Treasure Hunt','Jade Palace','Lucky Crown','Thunder Gods'];
const games=[];for(let i=0;i<348;i++){let b=base[i%base.length];let name=i<base.length?b[0]:extras[(i-base.length)%extras.length]+' '+(Math.floor((i-base.length)/extras.length)+1);games.push({name,emoji:b[1],color:b[2],cat:b[3]});}
const grid=document.getElementById('games');let active='Quente';function render(){let q=document.getElementById('search').value.trim().toLowerCase();let list=games.filter(g=>(active==='Todos'||active==='Quente'||g.cat===active)&&(!q||g.name.toLowerCase().includes(q)));grid.innerHTML=list.map((g,i)=>`<div class="game ${g.color}" data-cat="${g.cat}" data-name="${g.name}" onclick="openGame(this)"><div class="art">${g.emoji}</div><div class="star">★</div><div class="name">${g.name}</div></div>`).join('');document.getElementById('heading').textContent=(active==='Todos'?'Todos os jogos':active+' jogos');document.querySelector('.section button').textContent='Todos　'+list.length+' ›'}function filter(cat){active=cat;document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('active',c.dataset.cat===cat));render()}document.querySelectorAll('.cat').forEach(c=>c.onclick=()=>filter(c.dataset.cat));document.getElementById('search').addEventListener('input',render);function openGame(c){document.getElementById('modalTitle').textContent=c.dataset.name;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function navTo(name,btn){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));btn.classList.add('active');const notice=document.getElementById('notice');notice.textContent=name+' — área demonstrativa do protótipo.';notice.classList.add('show');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function toast(s){const n=document.getElementById('notice');n.textContent=s;n.classList.add('show')}render();
</script></body></html>
